server:
  port:8080

spring:
  main:
    allow-bean-definition-overriding: true
  mvc:
    servlet:
      path: /api
  datasource:
    url: jdbc:mysql://localhost:3306/security_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ****（用户名）
    password: ****（密码）
    drive-class-name: com.mysql.cj.jdbc.Driver

  mybatis:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

      global-config:
        id-type: auto
        logic-delete-field: status

jwt:
  secret: ${JWT_SECRET}   # 不再写死，改为读取环境变量！
  expiration: 86400000

logging:
  level:
    org.springframework.security: DEBUG